# Build iOS et envoi sur TestFlight, sans terminal : Actions → « Build iOS (TestFlight) » → Run workflow.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   EXPO_TOKEN                      jeton d'accès Expo (expo.dev → Account settings → Access tokens)
#   EAS_PROJECT_ID                  identifiant du projet EAS (expo.dev → projet → Overview → Project ID)
#   EXPO_OWNER                      nom du compte Expo (propriétaire du projet)
#   EXPO_PUBLIC_BACKEND_URL         URL publique du backend (https://…), sans slash final
#   EXPO_PUBLIC_REVENUECAT_IOS_API_KEY
#   EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY
#   EXPO_PUBLIC_REVENUECAT_TEST_API_KEY
#   ASC_API_KEY_P8                  contenu du fichier .p8 de la clé App Store Connect
#   ASC_KEY_ID                      identifiant de cette clé (10 caractères)
#   ASC_ISSUER_ID                   Issuer ID (App Store Connect → Users and Access → Integrations)
#   APPLE_TEAM_ID                   identifiant d'équipe Apple (ex. LKS2WGPAQ5)
name: Build iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Envoyer automatiquement sur TestFlight"
        type: boolean
        default: true
      premiere_fois:
        description: "Première fois : laisser EAS créer le certificat, le profil et la clé push Apple"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      - name: Dépendances
        run: yarn install --frozen-lockfile

      # Un fichier .env serait ignoré par git, donc jamais envoyé au serveur de build : les variables publiques
      # sont ajoutées au profil « production » de eas.json (lu localement par eas-cli et transmis au build).
      - name: Variables publiques de l'app (profil production de eas.json)
        env:
          BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          RC_IOS: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}
          RC_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          RC_TEST: ${{ secrets.EXPO_PUBLIC_REVENUECAT_TEST_API_KEY }}
        run: |
          tmp=$(mktemp)
          jq --arg u "$BACKEND_URL" --arg i "$RC_IOS" --arg a "$RC_ANDROID" --arg t "$RC_TEST" \
            '.build.production.env += {
               EXPO_PUBLIC_BACKEND_URL: $u,
               EXPO_PUBLIC_PUBLIC_BASE_URL: $u,
               EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: $i,
               EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: $a,
               EXPO_PUBLIC_REVENUECAT_TEST_API_KEY: $t }' eas.json > "$tmp" && mv "$tmp" eas.json

      - name: Clé App Store Connect (signature et envoi sans identifiant Apple)
        run: |
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/asc-key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: Build EAS (et envoi TestFlight)
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          # L'API Apple rejette la synchronisation automatique des capacités de l'App ID (bug EAS/Apple) ;
          # les capacités se gèrent à la main sur developer.apple.com → Identifiers.
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          ARGS="--platform ios --profile production --wait"
          if [ "${{ inputs.submit }}" = "true" ]; then
            ARGS="$ARGS --auto-submit"
          fi
          if [ "${{ inputs.premiere_fois }}" = "true" ]; then
            # EAS refuse de créer les certificats Apple en mode non interactif, et il passe en non interactif
            # dès que CI=true (le cas sur GitHub Actions) ou sans terminal. On lui donne donc CI=false et un
            # pseudo-terminal, puis on valide chaque question par Entrée : les réponses par défaut génèrent le
            # certificat de distribution, le profil de provisionnement, la clé push et la clé de soumission.
            ( while true; do echo; sleep 2; done ) | CI=false script -qefc "eas build $ARGS" /dev/null
          else
            eas build $ARGS --non-interactive
          fi
