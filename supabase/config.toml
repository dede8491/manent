project_id = "manent"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://manent.app"
additional_redirect_urls = ["manent://", "https://manent.app/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

[functions.ocr]
verify_jwt = true

[functions.wattpad-import]
verify_jwt = true

# Les pages publiques doivent être lisibles sans compte.
[functions.public-page]
verify_jwt = false
